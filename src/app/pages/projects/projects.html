<div class="room-container">
  <h1 class="room-title">My Projects</h1>
  <p class="section-subtitle" style="margin-top: 0; font-size: 1.2rem;">Here are some of the software solutions I am building.</p>

  <div class="projects-grid">
    <div *ngFor="let project of projects" class="project-card">
      <div class="project-content">
        <h3>{{ project.name }}</h3>
        <p>{{ project.description }}</p>
      </div>
      <div class="project-actions">
        <button class="like-btn" (click)="like(project)">
          👍 Like ({{ project.likes }})
        </button>
        <!-- We will add GitHub links here later -->
      </div>
    </div>
  </div>
</div>
