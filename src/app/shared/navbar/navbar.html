<nav class="navbar">

    <a routerLink="/" class="logo-text">Geoffrey Sankandi<span class="highlight-dot">.</span></a>

  <!-- Hamburger Menu Button (Animates to an 'X' when isMenuOpen is true) -->
  <button class="hamburger" [class.is-active]="isMenuOpen" (click)="toggleMenu()">

    <span class="bar"></span>

  <div class="nav-links" [class.active]="isMenuOpen">

    <a routerLink="/projects" routerLinkActive="active-btn" (click)="closeMenu()">Projects</a>
    <a routerLink="/blog" routerLinkActive="active-btn" (click)="closeMenu()">Blog</a>
